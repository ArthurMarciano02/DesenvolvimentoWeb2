<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        .cadastro {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: blue;
            color: yellow;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="cadastro">
        <h2>Cadastro</h2>

        <input type="text" placeholder="Nome">
        <input type="email" placeholder="E-mail">
        <input type="tel" placeholder="Telefone">

        <button>Cadastrar</button>
    </div>

</body>
</html>
